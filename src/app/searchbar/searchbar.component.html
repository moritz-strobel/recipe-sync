<div class="searchbar">
  <select class="dropdown" [(ngModel)]="selectedCategory">
      @for (option of searchCategories; track $index) {
          <option [value]="option">{{ option }}</option>
      }
  </select>

  <input type="text" [(ngModel)]="searchQuery" placeholder="Search..." (keyup.enter)="onSearch()" />

  <button type="submit" class="button" (click)="onSearch()">
      <i class="fas fa-search"></i>
  </button>
</div>
