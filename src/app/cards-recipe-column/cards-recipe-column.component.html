<section class="recipe-column-section">
    @if (heading) {
      <h2>{{ heading }}</h2>
    }
  
    <div class="container">
      <div class="card-container">
        @for (recipe of recipes; track recipe.id; let i = $index) {
          @if (i % 2 === 0) {
            <app-card-recipe-v2 [recipe]="recipe"></app-card-recipe-v2>
          } @else {
            <app-card-recipe-v3 [recipe]="recipe"></app-card-recipe-v3>
          }
        }
      </div>
    </div>
  </section>
