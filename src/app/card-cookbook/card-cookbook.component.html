<div class="cookbook-card">
  <img [src]="cookBook.coverImage" alt="{{ cookBook.title }}" class="cookbook-cover" />
  <h3>{{ cookBook.title }}</h3>
  <p>{{ cookBook.description }}</p>
  <button *ngIf="!cookBook.isDeleteable" (click)="deleteCookBook()">Delete</button>
  <button (click)="toggleFavorite()">{{ cookBook.isFavorite ? 'Unfavorite' : 'Favorite' }}</button>
</div>
