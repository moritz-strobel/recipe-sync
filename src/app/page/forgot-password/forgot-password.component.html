<main class="main">
  <form>
    <label>Enter your email</label>
    <input placeholder="doe@example.com" [formControl]="email" (blur)="updateErrorMessage()" required />
    @if (email.invalid) {
    <mat-error>{{errorMessage()}}</mat-error>
    }
  </form>

  <div class="actions">
    <span>
      Remember password again? <a href="./login">login</a>
    </span>
    <span>
      Don't have an Account? <a href="./register">register</a>
    </span>
  </div>
</main>
