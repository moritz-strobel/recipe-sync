<section class="recipe-cards-section">
    @if (heading) {
      <h2>{{ heading }}</h2>
    }
  
    <div class="container">
      <div class="card-container">
        @for (recipe of recipes; track recipe.id) {
          <app-card-recipe [recipe]="recipe"></app-card-recipe>
        }
      </div>
    </div>
  </section>
