<section>
    @if(heading){
    <h2>{{ heading }}</h2>
    }

    <div class="container">
        <button class="nav-button" (click)="scrollLeft()">&lt;</button>

        <div class="card-container" #cardContainer>
            @for (recipe of (recipes); track recipe.id){
            <app-card-recipe [recipe]="recipe"></app-card-recipe>
            }
        </div>

        <button class="nav-button" (click)="scrollRight()">&gt;</button>
    </div>
</section>
