<!--
    Show like-save container only on pages 'cookbook' & 'recipe'
-->
<div class="like-icon-container" (click)="onLike()">
    <div class="like">
        <i class="fas fa-thumbs-up"></i>
    </div>
</div>

<div class="container" (click)="onClick(saveMenu)">
    <div class="save">
        <i class="fas fa-bookmark"></i>
    </div>

    <ul #saveMenu>
        <a *ngFor="let cookbook of cookbooks" (click)="onSave(cookbook)">{{ cookbook.title }}</a>
    </ul>
</div>

<div class="container" (click)="onClick(plusMenu)">
    <div class="plus">
        <i class="fas fa-add"></i>
    </div>

    <ul #plusMenu>
        <a routerLink="/create-cookbook">Create Cookbook</a>
        <a routerLink="/create-recipe">Create Recipe</a>
    </ul>
</div>
